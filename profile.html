{% extends "base.html" %}{% block title %}My profile{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">YOUR ARTIST IDENTITY</div><h1>Musician profile</h1><p>Give organizers a reason to book your sound.</p></div></div>
<form class="panel form-panel" method="post"><div class="form-grid"><label>Genre<input name="genre" value="{{ profile.genre if profile else '' }}" placeholder="Indie rock, jazz, folk..."></label><label>City<input name="city" value="{{ profile.city if profile else '' }}" placeholder="Your city"></label><label>Instruments<input name="instruments" value="{{ profile.instruments if profile else '' }}" placeholder="Vocals, guitar, drums..."></label><label>Phone<input name="phone" value="{{ profile.phone if profile else '' }}" placeholder="Contact number"></label><label>Expected rate (₹)<input type="number" min="0" step="1" name="rate" value="{{ profile.rate if profile else 0 }}"></label><label class="span-2">About you<textarea name="bio" rows="5" maxlength="1000" placeholder="Tell organizers about your music, experience and style...">{{ profile.bio if profile else '' }}</textarea></label></div><button class="btn btn-primary">Save profile ↗</button></form>{% endblock %}
