{% extends "base.html" %}{% block title %}{{ 'Edit event' if event else 'Publish event' }}{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">GIVE THE MUSIC A STAGE</div><h1>{{ 'Edit event' if event else 'Publish an event' }}</h1><p>Share the details musicians need to apply.</p></div></div>
<form class="panel form-panel" method="post"><div class="form-grid"><label>Event title<input name="title" required maxlength="150" value="{{ event.title if event else '' }}"></label><label>Genre<input name="genre" value="{{ event.genre if event else '' }}" placeholder="Rock, jazz, electronic..."></label><label>Venue<input name="venue" required value="{{ event.venue if event else '' }}"></label><label>City<input name="city" required value="{{ event.city if event else '' }}"></label><label>Date<input type="date" name="event_date" required value="{{ event.event_date if event else '' }}"></label><label>Budget (₹)<input type="number" min="0" step="1" name="budget" value="{{ event.budget if event else 0 }}"></label><label class="span-2">Description<textarea name="description" rows="5">{{ event.description if event else '' }}</textarea></label></div><button class="btn btn-primary">{{ 'Save changes' if event else 'Publish event' }} ↗</button></form>{% endblock %}
